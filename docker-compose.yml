services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: securitypulse
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: securitypulse
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U securitypulse -d securitypulse"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgres://securitypulse:secret@postgres:5432/securitypulse
      TEAMS_WEBHOOK_URL: ${TEAMS_WEBHOOK_URL:-}
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://securitypulse:secret@postgres:5432/securitypulse
      GRAPH_TENANT_ID: ${GRAPH_TENANT_ID}
      GRAPH_CLIENT_ID: ${GRAPH_CLIENT_ID}
      GRAPH_CLIENT_SECRET: ${GRAPH_CLIENT_SECRET}
      TEAMS_WEBHOOK_URL: ${TEAMS_WEBHOOK_URL:-}
      USE_GRAPH_MOCK: ${USE_GRAPH_MOCK:-false}
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:3001
    depends_on:
      - api

volumes:
  postgres_data: {}
